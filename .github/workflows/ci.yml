name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 信頼基盤の差分の検出（ADR 0018 判断 1 の T3・判断 2 の S2。検出は scripts/trust-base-diff.sh）。
      # 既定は印のみ（失敗にしない）。失敗にするときは SIGIL_TRUST_BASE_MODE を fail にする（切替えはここだけ）。
      - name: 信頼基盤の差分
        if: github.event_name == 'pull_request'
        run: scripts/trust-base-diff.sh "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SIGIL_TRUST_BASE_MODE: mark

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version

      # ネイティブ出力のリンクに cc と glibc の静的ライブラリ(libc.a)が要る。
      - name: ネイティブ出力の前提
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo-nextest の導入
        uses: taiki-e/install-action@7c48f0a661edab95fdc666d1526d9ef945205245 # nextest
        with:
          tool: nextest@0.9.151

      - name: test（検証器・SIR 評価器・ネイティブを突き合わせる）
        run: |
          rm -f "${CARGO_TARGET_DIR:-target}"/tmp/native-report-*.tsv
          cargo nextest run --no-fail-fast
          cargo test --doc

      - name: ネイティブの突き合わせ件数（飛ばしの上限を検査）
        run: scripts/native-report.sh
        env:
          SIGIL_NATIVE_MAX_SKIP: "9"
          # キャッシュの古い記録を除いた run 43412110137 の実測は 803 件。
          SIGIL_NATIVE_MIN_CHECKED: "800"
