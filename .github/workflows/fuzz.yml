# 一時（Issue #674 の切り分け。この commit は PR に含めない）
name: Fuzz
on:
  workflow_dispatch:
    inputs:
      seed:
        required: false
        default: ""
      scale:
        required: false
        default: "1"
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev
      - run: cargo test --release --test ct_measure --no-run
      - run: cargo test --release --test ct_measure ct_diag_674 -- --ignored --nocapture --test-threads=1
