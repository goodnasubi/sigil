[package]
name = "sigil"
version = "0.0.0"
edition = "2021"
description = "Sigil 言語の処理系（M0: 字句解析・構文解析）"
license = "MIT"
publish = false

[lib]
name = "sigil"
path = "src/lib.rs"

[[bin]]
name = "sigil"
path = "src/main.rs"

# 依存クレートの追加は人間の承認が要る（ADR 0006）。Cranelift の 4 クレートだけ、所有者が 2026-10-26 に承認した（ADR 0015）。
[dependencies]
cranelift-codegen = "=0.137.0"
cranelift-frontend = "=0.137.0"
cranelift-module = "=0.137.0"
cranelift-object = "=0.137.0"
