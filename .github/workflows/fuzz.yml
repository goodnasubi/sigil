# 定期の長い実行（ADR 0020 の決定 2・W1 の C1）。
# 長いファジング、release ビルドの depth_limit、定数時間の計測を走らせる。
# PR では走らせない（schedule と workflow_dispatch だけ）。権限は読み取りだけで、秘密は使わない。
name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "乱数の種（空なら日付から決める）"
        required: false
        default: ""
      scale:
        description: "反復回数の倍率（既定 1）"
        required: false
        default: "1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      # ネイティブ出力のリンクに cc と glibc の静的ライブラリ(libc.a)が要る。
      - name: ネイティブ出力の前提
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev

      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            fuzz-${{ runner.os }}-

      # 種は日ごとに変える（探す範囲を広げる）。失敗したときに同じ種で再現できるよう、ここで表示する。
      # 入力はシェルに埋め込まず、環境変数で渡して数だけを受ける。
      - name: 種と回数を決める
        env:
          SEED_IN: ${{ github.event.inputs.seed }}
          SCALE_IN: ${{ github.event.inputs.scale }}
        run: |
          SEED="${SEED_IN:-$(date -u +%Y%m%d)}"
          SCALE="${SCALE_IN:-1}"
          case "$SEED$SCALE" in *[!0-9]*) echo "種と倍率は数字だけ"; exit 1;; esac
          echo "SIGIL_FUZZ_SEED=$SEED" >> "$GITHUB_ENV"
          echo "SCALE=$SCALE" >> "$GITHUB_ENV"
          echo "種: $SEED、倍率: $SCALE"

      # 失敗したら、種と入力（target/fuzz-failures/）を残してジョブを失敗にする。
      - name: fuzz_json（長い実行）
        run: |
          SIGIL_FUZZ_ITERS=$((1000000 * SCALE)) cargo test --test fuzz_json fuzz_json -- --nocapture
        timeout-minutes: 12

      - name: fuzz_parse（長い実行）
        run: |
          SIGIL_FUZZ_ITERS=$((300000 * SCALE)) cargo test --test fuzz_parse fuzz_parse -- --nocapture
        timeout-minutes: 20

      - name: depth_limit（release）
        run: cargo test --release --test depth_limit

      # 計測は記録として出すだけで、ジョブを失敗にしない（共用の機械の雑音で偽の失敗が出るため）。
      # ct_measure は ADR 6-1 で加わる。まだなければ飛ばす。
      - name: 定数時間の計測（ct_measure）
        continue-on-error: true
        run: |
          if [ -f tests/ct_measure.rs ]; then
            cargo test --release --test ct_measure -- --nocapture
          else
            echo "tests/ct_measure.rs がまだない（ADR 6-1 で加わる）。飛ばす。"
          fi

      - name: 失敗した入力を残す
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failures
          path: target/fuzz-failures/
          if-no-files-found: ignore
          retention-days: 30
